name: Backend Deploy (EC2)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # Navigate to the project directory on your server
            # CHANGE THIS to your actual server path
            cd /home/ubuntu/matrixtrack-backend
            
            # Pull latest changes
            git pull --ff-only origin main
            
            # Install dependencies
            npm ci

            # Upgrade the database configured on this server before restarting.
            npm run migrate:workforce -- --apply
            
            # Restart the service (Assuming PM2 is used and process name is 'matrixtrack-api')
            # CHANGE 'matrixtrack-api' to your actual PM2 process name
            if pm2 describe matrixtrack-api > /dev/null 2>&1; then
              pm2 restart matrixtrack-api --update-env
            else
              pm2 start app.js --name matrixtrack-api
            fi
